<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Application</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <!-- Custom CSS -->
    <style>
        /* Add your custom styles here */
        .chat-box {
            border: 1px solid #ccc;
            height: 400px;
            overflow-y: scroll;
            padding: 10px;
        }
    </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-light bg-light">
    <a class="navbar-brand" href="#">Chat App</a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ml-auto">
            <li class="nav-item">
                <a class="nav-link" href="#">Home</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#">About</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#">Contact</a>
            </li>
        </ul>
    </div>
</nav>
    <div class="container mt-5">
        <div class="row">
            <div class="col-md-4">
                <div class="card">
                    <div class="card-header">
                        User List
                    </div>
                    <div class="card-body" id="user-list">
                        <!-- User list will be displayed here -->
                        <ul>
                            <li>User 1</li>
                            <li>User 2</li>
                            <li>User 3</li>
                        </ul>
                    </div>
                </div>
            </div>
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header">
                        Chat with <span id="chat-username"></span>
                    </div>
                    <div class="card-body chat-box" id="chat-box">
                        <!-- Chat messages will be displayed here -->
                        <!-- Messages will be added dynamically using JavaScript -->
                    </div>
                    <div class="card-footer">
                        <input type="text" id="message-input" class="form-control" placeholder="Type your message...">
                        <button id="send-button" class="btn btn-primary mt-2">Send</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS (Optional) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

    <!-- Your custom JavaScript -->
    <script>
        // Sample user data (replace with your actual data)
        const users = ['User 1', 'User 2', 'User 3'];

        // Populate user list
        const userList = document.getElementById("user-list");
        users.forEach(user => {
            const userItem = document.createElement("li");
            userItem.textContent = user;
            userItem.addEventListener("click", function() {
                // Set the chat username when a user is clicked
                document.getElementById("chat-username").textContent = user;
            });
            userList.appendChild(userItem);
        });

        document.getElementById("send-button").addEventListener("click", function() {
            sendMessage();
        });

        document.getElementById("message-input").addEventListener("keyup", function(event) {
            if (event.key === "Enter") {
                sendMessage();
            }
        });

        function sendMessage() {
            var message = document.getElementById("message-input").value;
            if (message) {
                var chatBox = document.getElementById("chat-box");
                var messageDiv = document.createElement("div");
                messageDiv.className = "message";
                messageDiv.innerHTML = "<strong>You:</strong> " + message;
                chatBox.appendChild(messageDiv);

                // Clear the input
                document.getElementById("message-input").value = "";
            }
        }
    </script>
</body>
</html>
