{% comment %} <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex items-center justify-center bg-gray-800 from-blue-500 to-rose-400">

  <div class="bg-white/20 backdrop-blur-md p-8 rounded-2xl shadow-lg w-full max-w-md">
    <h2 class="text-3xl font-bold text-white text-center mb-6">Create Account</h2>
    <form id="registerForm" class="space-y-4">
      <input name="first_name" type="text" placeholder="First Name" required class="w-full px-4 py-2 rounded-md bg-white/80 focus:ring-2 focus:ring-rose-400 outline-none">
      <input name="last_name" type="text" placeholder="Last Name" required class="w-full px-4 py-2 rounded-md bg-white/80 focus:ring-2 focus:ring-rose-400 outline-none">
      <input name="username" type="text" placeholder="Username" required class="w-full px-4 py-2 rounded-md bg-white/80 focus:ring-2 focus:ring-rose-400 outline-none">
      <input name="email" type="email" placeholder="Email" required class="w-full px-4 py-2 rounded-md bg-white/80 focus:ring-2 focus:ring-rose-400 outline-none">
      <input name="password" type="password" placeholder="Password" required class="w-full px-4 py-2 rounded-md bg-white/80 focus:ring-2 focus:ring-rose-400 outline-none">
      <input name="password2" type="password" placeholder="Confirm Password" required class="w-full px-4 py-2 rounded-md bg-white/80 focus:ring-2 focus:ring-rose-400 outline-none">
      
      <button type="submit" class="w-full py-2 bg-rose-500 text-white rounded-full hover:bg-rose-600 transition">Register</button>
    </form>
    <p id="registerSuccess" class="text-green-200 mt-4 text-center hidden">Registration successful! You can now <a href="{% url 'login' %}" class="underline">login</a>.</p>
    <p id="registerError" class="text-red-200 mt-4 text-center hidden"></p>
    <p class="text-center mt-4 text-white">Already have an account? <a href="{% url 'login' %}" class="underline">Login here</a></p>
  </div>

  <script>
    document.getElementById("registerForm").addEventListener("submit", async function(e) {
      e.preventDefault();
      const form = e.target;
      const data = {
        first_name: form.first_name.value,
        last_name: form.last_name.value,
        username: form.username.value,
        email: form.email.value,
        password: form.password.value,
        password2: form.password2.value
      };

      const res = await fetch("/api/register/", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
      });

      const resData = await res.json();
      if (res.ok) {
        document.getElementById("registerSuccess").classList.remove("hidden");
        document.getElementById("registerError").classList.add("hidden");
        form.reset();
        window.location.href('/login/')
      } else {
        document.getElementById("registerError").textContent = Object.values(resData).join(" ");
        document.getElementById("registerError").classList.remove("hidden");
        document.getElementById("registerSuccess").classList.add("hidden");
      }
    });
  </script>

</body>
</html> {% endcomment %}
