{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chat App</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Toastify -->
    <link
        href="https://cdn.jsdelivr.net/npm/toastify-js@1.12.0/dist/toastify.min.css"
        rel="stylesheet"
    >

    <script src="https://cdn.jsdelivr.net/npm/toastify-js@1.12.0/dist/toastify.min.js"></script>

    <style>
        .chat-box {
            height: 400px;
            overflow-y: auto;
        }
    </style>
</head>

<body class="bg-gray-100">

    <!-- =====================================================
         NAVBAR
    ====================================================== -->

    <header class="flex items-center justify-between bg-blue-900 text-white px-8 py-2 shadow">

        <div class="text-lg font-bold">

            Chat App

            <a
                href="{% url 'channel:index' %}"
                class="ml-5 bg-gradient-to-r from-red-500 to-pink-400 text-sm px-3 py-1 rounded hover:bg-red-600"
            >
                Home
            </a>

        </div>

        <div class="flex items-center gap-4">

            <input
                type="text"
                placeholder="Search..."
                class="px-2 py-1 text-sm rounded text-black focus:outline-none"
            >

            <!-- User Info -->
            <span
                id="userInfo"
                class="text-sm italic"
            ></span>

            <!-- Logout -->
            <button
                id="logoutBtn"
                type="button"
                class="bg-red-500 text-sm px-3 py-1 rounded hover:bg-red-600"
            >
                Logout
            </button>

        </div>

    </header>


    <!-- =====================================================
         MAIN CONTENT
    ====================================================== -->

    {% block content %}
    {% endblock content %}


    <!-- =====================================================
         ADMIN PANEL AUTH SYSTEM
    ====================================================== -->

    <script src="{% static 'js/core/config.js' %}"></script>
    <script src="{% static 'js/core/storage.js' %}"></script>
    <script src="{% static 'js/core/auth.js' %}"></script>


    <!-- =====================================================
         CHANNEL JS
    ====================================================== -->

    <script src="{% static 'js/channelbase.js' %}"></script>

</body>

</html>
