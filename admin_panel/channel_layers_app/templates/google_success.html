<!DOCTYPE html>
<html>
<head>
    <title>Google Login</title>
</head>
<body>

<script>

const params = new URLSearchParams(window.location.search);

localStorage.setItem("access", params.get("access"));
localStorage.setItem("refresh", params.get("refresh"));

window.location.href = "/index/";

</script>

</body>
</html>
