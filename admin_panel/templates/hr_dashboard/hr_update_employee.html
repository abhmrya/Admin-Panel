{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        HR - Employee Management
    </title>

    <script src="https://cdn.tailwindcss.com"></script>

</head>


<body class="bg-gray-50">

<div class="min-h-screen">


    <!-- =====================================================
         HEADER
         ===================================================== -->

<header class="border-b border-gray-200 bg-white">

    <div class="mx-auto max-w-7xl px-6 py-5">

        <div class="flex items-center justify-between gap-4">

            <!-- Left -->
            <div class="flex items-center gap-4">

                <!-- Back Button -->
                <button
                    type="button"
                    onclick="history.back()"
                    class="group flex h-10 w-10 items-center justify-center
                           rounded-lg border border-gray-200 bg-white
                           text-gray-500 shadow-sm
                           transition-all duration-200
                           hover:-translate-x-0.5
                           hover:border-blue-200
                           hover:bg-blue-50
                           hover:text-blue-600"
                    title="Go Back"
                >
                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        class="h-5 w-5 transition-transform duration-200
                               group-hover:-translate-x-0.5"
                        fill="none"
                        viewBox="0 0 24 24"
                        stroke="currentColor"
                        stroke-width="2"
                    >
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            d="M15 19l-7-7 7-7"
                        />
                    </svg>
                </button>


                <!-- Page Title -->
                <div>

                    <h1 class="text-2xl font-bold text-gray-900">
                        Employee Management
                    </h1>

                    <p class="mt-1 text-sm text-gray-500">
                        Manage HR employees
                    </p>

                </div>

            </div>


            <!-- Right -->
            <div class="rounded-lg bg-blue-50 px-4 py-2">

                <span class="text-sm text-blue-600">
                    Total Employees:
                </span>

                <span
                    id="employeeCount"
                    class="ml-1 font-semibold text-blue-700"
                >
                    0
                </span>

            </div>

        </div>

    </div>

</header>



    <!-- =====================================================
         MAIN
         ===================================================== -->

    <main class="mx-auto max-w-7xl px-6 py-8">


        <!-- =================================================
             TABLE CARD
             ================================================= -->

        <div
            class="overflow-hidden
                   rounded-xl
                   border
                   border-gray-200
                   bg-white
                   shadow-sm"
        >


            <!-- TABLE -->

            <div class="overflow-x-auto">

                <table class="min-w-full text-sm">

                    <thead
                        class="border-b
                               border-gray-200
                               bg-gray-50"
                    >

                        <tr>

                            <th class="px-6 py-4 text-left font-semibold text-gray-600">
                                Employee
                            </th>

                            <th class="px-6 py-4 text-left font-semibold text-gray-600">
                                Email
                            </th>

                            <th class="px-6 py-4 text-left font-semibold text-gray-600">
                                Role
                            </th>

                            <th class="px-6 py-4 text-left font-semibold text-gray-600">
                                Department
                            </th>

                            <th class="px-6 py-4 text-left font-semibold text-gray-600">
                                Status
                            </th>

                            <th class="px-6 py-4 text-left font-semibold text-gray-600">
                                Created
                            </th>

                            <th class="px-6 py-4 text-left font-semibold text-gray-600">
                                Action
                            </th>

                        </tr>

                    </thead>


                    <tbody
                        id="employeesTableBody"
                        class="divide-y divide-gray-100"
                    >

                        <tr>

                            <td
                                colspan="7"
                                class="px-6 py-10 text-center text-gray-500"
                            >
                                Loading employees...
                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>



            <!-- =================================================
                 PAGINATION
                 ================================================= -->

            <div
                class="flex
                       items-center
                       justify-between
                       border-t
                       border-gray-200
                       px-6
                       py-4"
            >

                <button
                    id="previousPageBtn"
                    type="button"
                    onclick="previousPage()"
                    disabled
                    class="rounded-lg
                           border
                           border-gray-300
                           px-4
                           py-2
                           text-sm
                           font-medium
                           text-gray-600
                           disabled:cursor-not-allowed
                           disabled:opacity-40
                           hover:bg-gray-50"
                >
                    Previous
                </button>


                <span class="text-sm text-gray-500">
                    Employee List
                </span>


                <button
                    id="nextPageBtn"
                    type="button"
                    onclick="nextPage()"
                    disabled
                    class="rounded-lg
                           border
                           border-gray-300
                           px-4
                           py-2
                           text-sm
                           font-medium
                           text-gray-600
                           disabled:cursor-not-allowed
                           disabled:opacity-40
                           hover:bg-gray-50"
                >
                    Next
                </button>

            </div>

        </div>

    </main>

</div>



<!-- =========================================================
     EDIT EMPLOYEE MODAL
     ========================================================= -->

<div
    id="userModal"
    class="fixed
           inset-0
           z-50
           hidden
           items-center
           justify-center
           bg-black/50
           p-4"
>

    <div
        class="w-full
               max-w-2xl
               rounded-xl
               bg-white
               shadow-xl"
    >


        <!-- MODAL HEADER -->

        <div
            class="flex
                   items-center
                   justify-between
                   border-b
                   border-gray-200
                   px-6
                   py-4"
        >

            <div>

                <h2
                    id="modalTitle"
                    class="text-xl font-semibold text-gray-900"
                >
                    Edit Employee
                </h2>

                <p class="mt-1 text-sm text-gray-500">
                    Update employee information
                </p>

            </div>


            <button
                id="closeModal"
                type="button"
                class="text-2xl text-gray-400 hover:text-gray-600"
            >
                &times;
            </button>

        </div>



        <!-- FORM -->

        <form
            id="userForm"
            class="p-6"
        >

            <input
                type="hidden"
                id="userId"
            >


            <!-- ALERT -->

            <div
                id="alertContainer"
                class="mb-5 hidden"
            >

                <div
                    id="alertMessage"
                    class="rounded-lg px-4 py-3 text-sm"
                ></div>

            </div>



            <!-- FORM GRID -->

            <div
                class="grid
                       grid-cols-1
                       gap-5
                       md:grid-cols-2"
            >


                <!-- USERNAME -->

                <div>

                    <label
                        for="username"
                        class="mb-1 block text-sm font-medium text-gray-700"
                    >
                        Username
                    </label>

                    <input
                        id="username"
                        type="text"
                        required
                        class="w-full
                               rounded-lg
                               border
                               border-gray-300
                               px-4
                               py-2.5
                               outline-none
                               focus:border-blue-500
                               focus:ring-2
                               focus:ring-blue-100"
                    >

                    <p
                        id="usernameError"
                        class="mt-1 text-xs text-red-500"
                    ></p>

                </div>



                <!-- EMAIL -->

                <div>

                    <label
                        for="email"
                        class="mb-1 block text-sm font-medium text-gray-700"
                    >
                        Email
                    </label>

                    <input
                        id="email"
                        type="email"
                        required
                        class="w-full
                               rounded-lg
                               border
                               border-gray-300
                               px-4
                               py-2.5
                               outline-none
                               focus:border-blue-500
                               focus:ring-2
                               focus:ring-blue-100"
                    >

                    <p
                        id="emailError"
                        class="mt-1 text-xs text-red-500"
                    ></p>

                </div>



                <!-- FIRST NAME -->

                <div>

                    <label
                        for="first_name"
                        class="mb-1 block text-sm font-medium text-gray-700"
                    >
                        First Name
                    </label>

                    <input
                        id="first_name"
                        type="text"
                        required
                        class="w-full
                               rounded-lg
                               border
                               border-gray-300
                               px-4
                               py-2.5
                               outline-none
                               focus:border-blue-500
                               focus:ring-2
                               focus:ring-blue-100"
                    >

                </div>



                <!-- LAST NAME -->

                <div>

                    <label
                        for="last_name"
                        class="mb-1 block text-sm font-medium text-gray-700"
                    >
                        Last Name
                    </label>

                    <input
                        id="last_name"
                        type="text"
                        class="w-full
                               rounded-lg
                               border
                               border-gray-300
                               px-4
                               py-2.5
                               outline-none
                               focus:border-blue-500
                               focus:ring-2
                               focus:ring-blue-100"
                    >

                </div>



                <!-- ROLE -->

                <div>

                    <label
                        for="role"
                        class="mb-1 block text-sm font-medium text-gray-700"
                    >
                        Role
                    </label>

                    <select
                        id="role"
                        class="w-full
                               rounded-lg
                               border
                               border-gray-300
                               bg-white
                               px-4
                               py-2.5
                               outline-none
                               focus:border-blue-500"
                    >

                        <option value="EMPLOYEE">
                            Employee
                        </option>

                        <option value="MANAGER">
                            Manager
                        </option>

                        <option value="HR">
                            HR
                        </option>

                    </select>

                </div>



                <!-- DEPARTMENT -->

                <div>

                    <label
                        for="department"
                        class="mb-1 block text-sm font-medium text-gray-700"
                    >
                        Department
                    </label>

                    <select
                        id="department"
                        class="w-full
                               rounded-lg
                               border
                               border-gray-300
                               bg-white
                               px-4
                               py-2.5
                               outline-none
                               focus:border-blue-500"
                    >

                        <option value="">
                            Select Department
                        </option>

                    </select>

                </div>



                <!-- STATUS -->

                <div>

                    <label
                        for="is_active"
                        class="mb-1 block text-sm font-medium text-gray-700"
                    >
                        Status
                    </label>

                    <select
                        id="is_active"
                        class="w-full
                               rounded-lg
                               border
                               border-gray-300
                               bg-white
                               px-4
                               py-2.5
                               outline-none
                               focus:border-blue-500"
                    >

                        <option value="true">
                            Active
                        </option>

                        <option value="false">
                            Inactive
                        </option>

                    </select>

                </div>

            </div>



            <!-- BUTTONS -->

            <div
                class="mt-7 flex justify-end gap-3"
            >

                <button
                    id="cancelBtn"
                    type="button"
                    class="rounded-lg
                           border
                           border-gray-300
                           px-5
                           py-2.5
                           text-sm
                           font-medium
                           text-gray-700
                           hover:bg-gray-50"
                >
                    Cancel
                </button>


                <button
                    id="saveBtn"
                    type="submit"
                    class="rounded-lg
                           bg-blue-600
                           px-5
                           py-2.5
                           text-sm
                           font-medium
                           text-white
                           hover:bg-blue-700"
                >
                    Save Changes
                </button>

            </div>

        </form>

    </div>

</div>



<!-- =========================================================
     JAVASCRIPT
     ========================================================= -->

<script src="{% static 'js/core/config.js' %}"></script>
<script src="{% static 'js/core/storage.js' %}"></script>
<script src="{% static 'js/core/auth.js' %}"></script>
<script src="{% static 'js/core/api.js' %}"></script>
<script src="{% static 'js/core/alerts.js' %}"></script>

<script src="{% static 'js/services/department.service.js' %}"></script>
<script src="{% static 'js/services/hr-employee.service.js' %}"></script>

<script src="{% static 'js/hr_dashboard/employees.js' %}"></script>
<script src="{% static 'js/hr_dashboard/employee-update.js' %}"></script>

</body>
</html>
