<!DOCTYPE html>
{% load static %}
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
        {% block page_title %}Admin Panel{% endblock %}
        {% endblock %}
    </title>

    {% comment %} <link rel="icon" href="{% static 'images/favicon.png' %}"> {% endcomment %}
    <link rel="stylesheet" href="{% static 'css/output.css' %}">

    {% block extra_css %}
    {% endblock %}
</head>

<body class="min-h-screen bg-slate-100 antialiased">

    {% block body %}
    {% endblock %}

    {% block extra_js %}
    {% endblock %}

</body>

</html>
