{% extends "base/base.html" %}


{% block body %}


<div class="min-h-screen flex bg-slate-100">


    <!-- Sidebar -->

    <aside class="w-64 bg-indigo-900 text-white min-h-screen">


        <div class="px-6 py-5 text-xl font-bold border-b border-indigo-800">

            🏢 Admin Panel

        </div>



        <nav class="mt-5 px-3 space-y-2">


            <a href="#" class="block px-4 py-2 rounded-lg hover:bg-indigo-700">

            <a href="#" class="block px-4 py-2 rounded-lg hover:bg-indigo-700">
