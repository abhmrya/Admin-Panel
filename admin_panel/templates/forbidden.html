{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>403 - Access Forbidden</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-slate-50 flex items-center justify-center px-6">

    <div class="w-full max-w-lg text-center">

        <!-- 403 -->
        <div class="mb-6">
            <h1 class="text-[120px] leading-none font-extrabold text-slate-200">
                403
            </h1>
        </div>

        <!-- Icon -->
        <div class="mx-auto mb-6 flex h-20 w-20 items-center justify-center
                    rounded-full bg-red-100">

            <svg
                class="h-10 w-10 text-red-600"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
                stroke-width="1.8"
            >
                <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M12 15v2m0-8v2m-7.5 9h15a1.5 1.5 0 001.3-2.25l-7.5-13a1.5 1.5 0 00-2.6 0l-7.5 13A1.5 1.5 0 004.5 20z"
                />
            </svg>
        </div>

        <!-- Content -->
        <h2 class="text-3xl font-bold text-slate-900">
            Access Forbidden
        </h2>

        <p class="mt-3 text-slate-500 leading-6">
            You don't have permission to access this page.
            Please contact your administrator if you believe this is a mistake.
        </p>

        <!-- Actions -->
        <div class="mt-8 flex flex-col sm:flex-row gap-3 justify-center">

            <button
                onclick="history.back()"
                class="inline-flex items-center justify-center gap-2
                       rounded-lg bg-slate-900 px-6 py-3
                       text-sm font-semibold text-white
                       transition hover:bg-slate-800"
            >
                <svg
                    class="h-4 w-4"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                >
                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M10 19l-7-7m0 0l7-7m-7 7h18"
                    />
                </svg>

                Go Back
            </button>

            <a
                href="/"
                class="inline-flex items-center justify-center gap-2
                       rounded-lg border border-slate-300
                       bg-white px-6 py-3
                       text-sm font-semibold text-slate-700
                       transition hover:bg-slate-50"
            >
                Go to Dashboard
            </a>

        </div>

        <!-- Footer -->
        <p class="mt-10 text-xs text-slate-400">
            Error Code: 403 • Forbidden
        </p>

    </div>

</body>
</html>
