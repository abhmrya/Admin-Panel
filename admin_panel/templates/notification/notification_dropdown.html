{% load static %}

<div
    id="notificationComponent"
    class="relative"
>

    <!-- =====================================================
         BELL BUTTON
    ====================================================== -->

    <button
        id="notificationBell"
        type="button"
        aria-label="Notifications"
        aria-expanded="false"
        class="relative flex h-10 w-10 items-center justify-center rounded-xl text-gray-600 transition hover:bg-gray-100 hover:text-indigo-600 focus:outline-none"
    >

        <!-- Bell Icon -->

        <svg
            class="h-6 w-6"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            viewBox="0 0 24 24"
        >
            <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"
            />
        </svg>


        <!-- =================================================
             UNREAD BADGE
        ================================================== -->

        <span
            id="notificationUnreadBadge"
            class="absolute -right-0.5 -top-0.5 hidden min-w-[18px] items-center justify-center rounded-full bg-red-500 px-1 text-[10px] font-bold leading-[18px] text-white ring-2 ring-white"
        >
            0
        </span>

    </button>


    <!-- =====================================================
         DROPDOWN
    ====================================================== -->

    <div
        id="notificationDropdown"
        class="absolute right-0 top-12 z-50 hidden w-[360px] max-w-[calc(100vw-2rem)] overflow-hidden rounded-2xl border border-gray-200 bg-white shadow-2xl"
    >

        <!-- =================================================
             HEADER
        ================================================== -->

        <div class="flex items-center justify-between border-b border-gray-100 px-4 py-3">

            <div>

                <h3 class="text-sm font-semibold text-gray-800">
                    Notifications
                </h3>

                <p
                    id="notificationUnreadText"
                    class="mt-0.5 text-xs text-gray-400"
                >
                    No unread notifications
                </p>

            </div>


            <button
                id="markAllNotificationsRead"
                type="button"
                class="text-xs font-semibold text-indigo-600 transition hover:text-indigo-800"
            >
                Mark all as read
            </button>

        </div>


        <!-- =================================================
             LOADING
        ================================================== -->

        <div
            id="notificationLoading"
            class="hidden px-4 py-8 text-center"
        >

            <div class="mx-auto h-6 w-6 animate-spin rounded-full border-2 border-gray-200 border-t-indigo-600"></div>

            <p class="mt-2 text-xs text-gray-400">
                Loading notifications...
            </p>

        </div>


        <!-- =================================================
             NOTIFICATION LIST
        ================================================== -->

        <div
            id="notificationList"
            class="max-h-[420px] overflow-y-auto"
        >
        </div>


        <!-- =================================================
             EMPTY STATE
        ================================================== -->

        <div
            id="notificationEmpty"
            class="hidden px-6 py-10 text-center"
        >

            <div class="mx-auto flex h-12 w-12 items-center justify-center rounded-full bg-gray-100 text-gray-400">

                <svg
                    class="h-6 w-6"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    viewBox="0 0 24 24"
                >
                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"
                    />
                </svg>

            </div>

            <p class="mt-3 text-sm font-medium text-gray-600">
                No notifications
            </p>

            <p class="mt-1 text-xs text-gray-400">
                You're all caught up.
            </p>

        </div>

    </div>

</div>
