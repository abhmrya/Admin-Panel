{% extends "base/dashboard_base.html" %}
{% load static %}

{% block page_title %}Admin Dashboard{% endblock %}

{% block content %}

<h1 class="text-3xl font-bold mb-6 text-gray-800">
    Admin Dashboard
</h1>

<div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-6">

    <div class="bg-white rounded-xl shadow p-6">
        <p class="text-gray-500">Users</p>
        <h2 id="statUsersCount" class="text-3xl font-bold mt-2">--</h2>
    </div>

    <div class="bg-white rounded-xl shadow p-6">
        <p class="text-gray-500">Admins</p>
        <h2 id="statAdminsCount" class="text-3xl font-bold mt-2">--</h2>
    </div>

    <div class="bg-white rounded-xl shadow p-6">
        <p class="text-gray-500">Managers</p>
        <h2 id="statManagersCount" class="text-3xl font-bold mt-2">--</h2>
    </div>

    <div class="bg-white rounded-xl shadow p-6">
        <p class="text-gray-500">Employees</p>
        <h2 id="statEmployeesCount" class="text-3xl font-bold mt-2">--</h2>
    </div>

</div>

{% endblock %}

{% block extra_js %}
{{ block.super }}
<script src="{% static 'js/dashboard/admin.js' %}"></script>
{% endblock %}
