{% extends "base/auth_base.html" %}

{% load static %}


{% block title %}
Login - Admin Panel
{% endblock %}



{% block content %}


<div class="bg-white w-full max-w-md rounded-xl shadow-md p-8">


    <h1 class="text-2xl font-bold text-slate-800 mb-1">
        Welcome Back
    </h1>


    <p class="text-slate-500 text-sm mb-6">
        Apne account me login karo
    </p>




    <form id="loginForm" class="space-y-4">


        <!-- Email -->

        <div>


            <label class="block text-sm font-medium text-slate-700 mb-1">

                Email

            </label>



            <input
            type="email"
            id="email"
            name="email"
            required
            class="w-full border border-slate-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
            >



            <p 
            class="field-error text-xs text-red-600 mt-1 hidden"
            data-field="email">
            </p>


        </div>






        <!-- Password -->


        <div>


            <label class="block text-sm font-medium text-slate-700 mb-1">

                Password

            </label>



            <input
            type="password"
            id="password"
            name="password"
            required
            class="w-full border border-slate-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
            >



            <p 
            class="field-error text-xs text-red-600 mt-1 hidden"
            data-field="password">
            </p>


        </div>






        <!-- Button -->


        <button
        type="submit"
        id="submitBtn"
        class="w-full bg-indigo-700 hover:bg-indigo-800 text-white font-semibold py-2.5 rounded-md text-sm transition">


            Login


        </button>




    </form>






    <p class="text-sm text-slate-500 mt-5 text-center">


        new account?


        <a 
        href="{% url 'accounts:register' %}"
        class="text-indigo-700 font-medium hover:underline">


            Register


        </a>


    </p>




</div>



{% endblock %}





{% block extra_js %}


<script src="{% static 'js/auth/login.js' %}"></script>


{% endblock %}
