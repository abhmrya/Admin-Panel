<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-slate-100 flex items-center justify-center px-4">

    <div class="w-full max-w-md bg-white rounded-2xl shadow-lg p-8">

        <div class="text-center mb-8">

            <h1 class="text-2xl font-bold text-slate-900">
                Reset Password
            </h1>

            <p class="mt-2 text-sm text-slate-500">
                Enter your new password below.
            </p>

        </div>

        <form id="resetPasswordForm" class="space-y-5">

            <div>

                <label
                    for="newPassword"
                    class="block text-sm font-medium text-slate-700 mb-2"
                >
                    New Password
                </label>

                <input
                    id="newPassword"
                    type="password"
                    required
                    minlength="8"
                    class="w-full rounded-lg border border-slate-300 px-4 py-3
                           outline-none focus:border-blue-500 focus:ring-2
                           focus:ring-blue-100"
                    placeholder="Enter new password"
                >

            </div>

            <div>

                <label
                    for="confirmPassword"
                    class="block text-sm font-medium text-slate-700 mb-2"
                >
                    Confirm Password
                </label>

                <input
                    id="confirmPassword"
                    type="password"
                    required
                    minlength="8"
                    class="w-full rounded-lg border border-slate-300 px-4 py-3
                           outline-none focus:border-blue-500 focus:ring-2
                           focus:ring-blue-100"
                    placeholder="Confirm new password"
                >

            </div>

            <div
                id="message"
                class="hidden rounded-lg px-4 py-3 text-sm"
            ></div>

            <button
                type="submit"
                id="resetButton"
                class="w-full rounded-lg bg-blue-600 px-4 py-3
                       font-semibold text-white
                       hover:bg-blue-700 transition"
            >
                Reset Password
            </button>

        </form>

    </div>

<script>

    const form = document.getElementById("resetPasswordForm");
    const message = document.getElementById("message");
    const button = document.getElementById("resetButton");

    const pathParts = window.location.pathname
        .split("/")
        .filter(Boolean);

    const uid = pathParts[pathParts.length - 2];
    const token = pathParts[pathParts.length - 1];


    form.addEventListener("submit", async (event) => {

        event.preventDefault();

        const newPassword =
            document.getElementById("newPassword").value;

        const confirmPassword =
            document.getElementById("confirmPassword").value;


        if (newPassword !== confirmPassword) {

            showMessage(
                "Passwords do not match.",
                "error"
            );

            return;
        }


        button.disabled = true;
        button.textContent = "Resetting...";


        try {

            const response = await fetch(
                "/api/v1/auth/password/reset/",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        uid: uid,
                        token: token,
                        new_password: newPassword,
                        confirm_password: confirmPassword
                    })
                }
            );


            const data = await response.json();


            if (!response.ok) {

                const errorMessage =
                    data.detail ||
                    data.message ||
                    "Unable to reset password.";

                showMessage(
                    errorMessage,
                    "error"
                );

                button.disabled = false;
                button.textContent = "Reset Password";

                return;
            }


            // SUCCESS

            showMessage(
                data.message ||
                "Password reset successfully. Redirecting to login...",
                "success"
            );


            form.reset();

            button.disabled = true;
            button.textContent = "Password Reset";


            setTimeout(() => {

                window.location.href = "/login/";

            }, 1500);


        } catch (error) {

            console.error(
                "Password reset error:",
                error
            );

            showMessage(
                "Something went wrong. Please try again.",
                "error"
            );

            button.disabled = false;
            button.textContent = "Reset Password";
        }

    });


    function showMessage(text, type) {

        message.textContent = text;

        message.classList.remove(
            "hidden",
            "bg-red-100",
            "text-red-700",
            "bg-green-100",
            "text-green-700"
        );


        if (type === "error") {

            message.classList.add(
                "bg-red-100",
                "text-red-700"
            );

        } else {

            message.classList.add(
                "bg-green-100",
                "text-green-700"
            );

        }
    }

</script>

</body>

</html>
