{% extends "base/auth_base.html" %}

{% load static %}

{% block title %}
Register - Admin Panel
{% endblock %}


{% block content %}

<div class="bg-white w-full max-w-md rounded-xl shadow-md p-8">

<h1 class="text-2xl font-bold text-slate-800 mb-1">
Create Account
</h1>

<p class="text-slate-500 text-sm mb-6">
Admin dashboard access ke liye register karo
</p>


<form id="registerForm" class="space-y-4">


<div>
<label class="block text-sm font-medium text-slate-700 mb-1">
Username
</label>

<input
type="text"
id="username"
name="username"
required
class="w-full border border-slate-300 rounded-md px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500">

<p class="field-error text-xs text-red-600 mt-1 hidden" data-field="username"></p>

</div>



<div>
<label class="block text-sm font-medium text-slate-700 mb-1">
Email
</label>

<input
type="email"
id="email"
name="email"
required
class="w-full border border-slate-300 rounded-md px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500">

<p class="field-error text-xs text-red-600 mt-1 hidden" data-field="email"></p>

</div>



<div>
<label class="block text-sm font-medium text-slate-700 mb-1">
First Name
</label>

<input
type="text"
id="first_name"
name="first_name"
required
class="w-full border border-slate-300 rounded-md px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500">

<p class="field-error text-xs text-red-600 mt-1 hidden" data-field="first_name"></p>

</div>



<div>
<label class="block text-sm font-medium text-slate-700 mb-1">
Last Name
</label>

<input
type="text"
id="last_name"
name="last_name"
class="w-full border border-slate-300 rounded-md px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500">

<p class="field-error text-xs text-red-600 mt-1 hidden" data-field="last_name"></p>

</div>



<div>
<label class="block text-sm font-medium text-slate-700 mb-1">
Password
</label>

<input
type="password"
id="password"
name="password"
required
class="w-full border border-slate-300 rounded-md px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500">

<p class="field-error text-xs text-red-600 mt-1 hidden" data-field="password"></p>

</div>



<div>
<label class="block text-sm font-medium text-slate-700 mb-1">
Confirm Password
</label>

<input
type="password"
id="confirm_password"
name="confirm_password"
required
class="w-full border border-slate-300 rounded-md px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500">

<p class="field-error text-xs text-red-600 mt-1 hidden" data-field="confirm_password"></p>

</div>




<button
type="submit"
id="submitBtn"
class="w-full bg-indigo-700 hover:bg-indigo-800 text-white font-semibold py-2.5 rounded-md text-sm">

Create Account

</button>


</form>



<p class="text-sm text-slate-500 mt-5 text-center">

Already have an account?

<a href="{% url 'accounts:login' %}"
class="text-indigo-700 font-medium hover:underline">

Login

</a>

</p>


</div>

{% endblock %}



{% block extra_js %}

<script src="{% static 'js/auth/register.js' %}"></script>

{% endblock %}
