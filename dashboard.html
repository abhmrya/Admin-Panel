<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Admin Panel</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col">

  <!-- ===== NAVBAR ===== -->
  <nav class="bg-indigo-900 text-white px-6 py-3 flex items-center justify-between shadow relative">
    <a href="/dashboard/" class="flex items-center gap-2 font-bold text-lg">
      <span class="bg-indigo-600 w-7 h-7 rounded flex items-center justify-center text-sm">🏢</span>
      Admin Panel
    </a>

    <div class="flex items-center gap-4">
      <span id="ipBadge" class="text-xs bg-white/10 px-3 py-1 rounded-full font-mono text-indigo-200">IP: --</span>

      <!-- Profile dropdown -->
      <div class="relative">
        <button id="userMenuBtn" class="flex items-center gap-2 hover:bg-white/10 px-2 py-1.5 rounded-md transition">
          <div id="avatarCircle"
            class="w-9 h-9 rounded-full bg-indigo-500 flex items-center justify-center font-bold text-sm border-2 border-white/40">
            ..
          </div>
          <div class="text-left leading-tight hidden sm:block">
            <p id="navUsername" class="text-sm font-semibold">Loading...</p>
            <p id="navEmail" class="text-[11px] text-indigo-200">--</p>
          </div>
        </button>

        <div id="userMenu"
          class="hidden absolute right-0 top-12 bg-white text-slate-800 w-64 rounded-lg shadow-xl overflow-hidden z-50">
          <div class="px-4 py-3 border-b border-slate-100">
            <p id="ddUsername" class="text-sm font-bold">--</p>
            <p id="ddEmail" class="text-xs text-slate-500">--</p>
            <p id="ddIp" class="text-[11px] text-slate-400 font-mono mt-1">IP: --</p>
          </div>
          <a href="#" class="block px-4 py-2.5 text-sm hover:bg-slate-50">👤 My Profile</a>
          <a href="#" class="block px-4 py-2.5 text-sm hover:bg-slate-50">⚙️ Settings</a>
          <button id="logoutBtn" class="w-full text-left px-4 py-2.5 text-sm text-red-600 hover:bg-red-50">🚪 Logout</button>
        </div>
      </div>
    </div>
  </nav>

  <!-- ===== ERROR / MESSAGE BAR — right below navbar ===== -->
  <div id="alertBox" class="max-w-4xl w-full mx-auto mt-4 px-4 hidden">
    <div id="alertInner" class="rounded-md border px-4 py-3 text-sm flex items-start justify-between gap-3"></div>
  </div>

  <!-- ===== MAIN ===== -->
  <main class="flex-1 max-w-4xl w-full mx-auto px-4 py-8">

    <h1 class="text-2xl font-bold text-slate-800 mb-1">Dashboard</h1>
    <p class="text-slate-500 text-sm mb-6">Aapki profile summary</p>

    <!-- Profile Card -->
    <div class="bg-white rounded-xl shadow-sm p-6 flex items-center gap-5 mb-6">
      <div id="bigAvatar"
        class="w-20 h-20 rounded-full bg-indigo-600 text-white flex items-center justify-center text-2xl font-bold shrink-0">
        ..
      </div>
      <div>
        <h2 id="cardUsername" class="text-lg font-bold text-slate-800">Loading...</h2>
        <p id="cardEmail" class="text-slate-500 text-sm">--</p>
        <span id="cardRole" class="inline-block mt-2 text-xs font-semibold px-2.5 py-1 rounded-full bg-indigo-100 text-indigo-700">--</span>
      </div>
    </div>

    <!-- Info Grid -->
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
      <div class="bg-white rounded-xl shadow-sm p-5">
        <p class="text-xs text-slate-400 uppercase tracking-wide mb-1">Full Name</p>
        <p id="infoFullName" class="text-sm font-semibold text-slate-800">--</p>
      </div>
      <div class="bg-white rounded-xl shadow-sm p-5">
        <p class="text-xs text-slate-400 uppercase tracking-wide mb-1">Phone Number</p>
        <p id="infoPhone" class="text-sm font-semibold text-slate-800">--</p>
      </div>
      <div class="bg-white rounded-xl shadow-sm p-5">
        <p class="text-xs text-slate-400 uppercase tracking-wide mb-1">Verified</p>
        <p id="infoVerified" class="text-sm font-semibold text-slate-800">--</p>
      </div>
      <div class="bg-white rounded-xl shadow-sm p-5">
        <p class="text-xs text-slate-400 uppercase tracking-wide mb-1">Joined On</p>
        <p id="infoJoined" class="text-sm font-semibold text-slate-800">--</p>
      </div>
      <div class="bg-white rounded-xl shadow-sm p-5">
        <p class="text-xs text-slate-400 uppercase tracking-wide mb-1">Current IP Address</p>
        <p id="infoIp" class="text-sm font-semibold text-slate-800 font-mono">--</p>
      </div>
      <div class="bg-white rounded-xl shadow-sm p-5">
        <p class="text-xs text-slate-400 uppercase tracking-wide mb-1">Role</p>
        <p id="infoRole" class="text-sm font-semibold text-slate-800">--</p>
      </div>
    </div>
  </main>

  <!-- ===== FOOTER ===== -->
  <footer class="bg-indigo-950 text-indigo-200 text-center text-xs py-4">
    &copy; <span id="year"></span> Admin Dashboard. All rights reserved.
  </footer>

<script>
  document.getElementById("year").textContent = new Date().getFullYear();

  const API_BASE = "/api/v1/auth";
  const token = localStorage.getItem("access_token");

  function showAlert(message, type = "error") {
    const box = document.getElementById("alertBox");
    const inner = document.getElementById("alertInner");
    const styles = {
      error: "bg-red-50 border-red-200 text-red-700",
      success: "bg-green-50 border-green-200 text-green-700",
    };
    inner.className = "rounded-md border px-4 py-3 text-sm flex items-start justify-between gap-3 " + styles[type];
    inner.innerHTML = `<span>${message}</span>
      <button onclick="document.getElementById('alertBox').classList.add('hidden')" class="opacity-60 hover:opacity-100">✕</button>`;
    box.classList.remove("hidden");
  }

  // Login zaroori hai — token nahi to seedha login page pe bhej do
  if (!token) {
    window.location.href = "/login/";
  }

  // ---- IP address ----
  fetch("https://api.ipify.org?format=json")
    .then(r => r.json())
    .then(d => {
      document.getElementById("ipBadge").textContent = "IP: " + d.ip;
      document.getElementById("ddIp").textContent = "IP: " + d.ip;
      document.getElementById("infoIp").textContent = d.ip;
    })
    .catch(() => {});

  // ---- User dropdown toggle ----
  const userMenuBtn = document.getElementById("userMenuBtn");
  const userMenu = document.getElementById("userMenu");
  userMenuBtn.addEventListener("click", () => userMenu.classList.toggle("hidden"));
  document.addEventListener("click", (e) => {
    if (!userMenuBtn.contains(e.target) && !userMenu.contains(e.target)) {
      userMenu.classList.add("hidden");
    }
  });

  // ---- Logout ----
  document.getElementById("logoutBtn").addEventListener("click", () => {
    localStorage.removeItem("access_token");
    localStorage.removeItem("refresh_token");
    window.location.href = "/login/";
  });

  // ---- Fetch current user (Me API) ----
  async function loadUser() {
    try {
      const res = await fetch(`${API_BASE}/apime/`, {
        headers: { Authorization: `Bearer ${token}` },
      });

      if (res.status === 401) {
        localStorage.removeItem("access_token");
        window.location.href = "/login/";
        return;
      }

      const user = await res.json();
      if (!res.ok) {
        showAlert("Profile data load nahi ho payi.", "error");
        return;
      }

      const initials = (user.username || "?").slice(0, 2).toUpperCase();
      document.getElementById("avatarCircle").textContent = initials;
      document.getElementById("bigAvatar").textContent = initials;

      document.getElementById("navUsername").textContent = user.username;
      document.getElementById("navEmail").textContent = user.email;
      document.getElementById("ddUsername").textContent = user.username;
      document.getElementById("ddEmail").textContent = user.email;

      document.getElementById("cardUsername").textContent = `${user.first_name || ""} ${user.last_name || ""}`.trim() || user.username;
      document.getElementById("cardEmail").textContent = user.email;
      document.getElementById("cardRole").textContent = user.role;

      document.getElementById("infoFullName").textContent = `${user.first_name || "-"} ${user.last_name || ""}`.trim();
      document.getElementById("infoPhone").textContent = user.phone_number || "-";
      document.getElementById("infoVerified").textContent = user.is_verified ? "✅ Verified" : "❌ Not Verified";
      document.getElementById("infoJoined").textContent = user.date_joined ? new Date(user.date_joined).toLocaleDateString() : "-";
      document.getElementById("infoRole").textContent = user.role;

    } catch (err) {
      showAlert("Server se connect nahi ho paya.", "error");
    }
  }

  loadUser();
</script>
</body>
</html>
