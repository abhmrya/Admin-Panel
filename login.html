<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Admin Panel</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col">

  <!-- ===== NAVBAR ===== -->
  <nav class="bg-indigo-900 text-white px-6 py-3 flex items-center justify-between shadow">
    <a href="/login/" class="flex items-center gap-2 font-bold text-lg">
      <span class="bg-indigo-600 w-7 h-7 rounded flex items-center justify-center text-sm">🏢</span>
      Admin Panel
    </a>
    <span id="ipBadge" class="text-xs bg-white/10 px-3 py-1 rounded-full font-mono text-indigo-200">IP: --</span>
  </nav>

  <!-- ===== ERROR / MESSAGE BAR — right below navbar ===== -->
  <div id="alertBox" class="max-w-md w-full mx-auto mt-4 px-4 hidden">
    <div id="alertInner" class="rounded-md border px-4 py-3 text-sm flex items-start justify-between gap-3"></div>
  </div>

  <!-- ===== MAIN ===== -->
  <main class="flex-1 flex items-center justify-center px-4 py-10">
    <div class="bg-white w-full max-w-md rounded-xl shadow-md p-8">
      <h1 class="text-2xl font-bold text-slate-800 mb-1">Welcome Back</h1>
      <p class="text-slate-500 text-sm mb-6">Apne account me login karo</p>

      <form id="loginForm" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Email</label>
          <input type="email" name="email" id="email" required
            class="w-full border border-slate-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
          <p class="field-error text-xs text-red-600 mt-1 hidden" data-field="email"></p>
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
          <input type="password" name="password" id="password" required
            class="w-full border border-slate-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
          <p class="field-error text-xs text-red-600 mt-1 hidden" data-field="password"></p>
        </div>

        <button type="submit" id="submitBtn"
          class="w-full bg-indigo-700 hover:bg-indigo-800 text-white font-semibold py-2.5 rounded-md text-sm transition">
          Login
        </button>
      </form>

      <p class="text-sm text-slate-500 mt-5 text-center">
        Naya account banana hai?
        <a href="/register/" class="text-indigo-700 font-medium hover:underline">Register</a>
      </p>
    </div>
  </main>

  <!-- ===== FOOTER ===== -->
  <footer class="bg-indigo-950 text-indigo-200 text-center text-xs py-4">
    &copy; <span id="year"></span> Admin Dashboard. All rights reserved.
  </footer>

<script>
  document.getElementById("year").textContent = new Date().getFullYear();

  fetch("https://api.ipify.org?format=json")
    .then(r => r.json())
    .then(d => document.getElementById("ipBadge").textContent = "IP: " + d.ip)
    .catch(() => {});

  const API_BASE = "/api/v1/auth";

  function showAlert(message, type = "error") {
    const box = document.getElementById("alertBox");
    const inner = document.getElementById("alertInner");
    const styles = {
      error:   "bg-red-50 border-red-200 text-red-700",
      success: "bg-green-50 border-green-200 text-green-700",
    };
    inner.className = "rounded-md border px-4 py-3 text-sm flex items-start justify-between gap-3 " + styles[type];
    inner.innerHTML = `<span>${message}</span>
      <button onclick="document.getElementById('alertBox').classList.add('hidden')" class="opacity-60 hover:opacity-100">✕</button>`;
    box.classList.remove("hidden");
  }

  function clearFieldErrors() {
    document.querySelectorAll(".field-error").forEach(el => {
      el.classList.add("hidden");
      el.textContent = "";
    });
  }

  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    clearFieldErrors();
    document.getElementById("alertBox").classList.add("hidden");

    const submitBtn = document.getElementById("submitBtn");
    submitBtn.disabled = true;
    submitBtn.textContent = "Logging in...";

    const payload = {
      email: document.getElementById("email").value.trim(),
      password: document.getElementById("password").value,
    };

    try {
      const res = await fetch(`${API_BASE}/apilogin/`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      const data = await res.json();

      if (!res.ok) {
        let shownFieldError = false;
        Object.keys(data).forEach((field) => {
          const el = document.querySelector(`.field-error[data-field="${field}"]`);
          if (el) {
            el.textContent = Array.isArray(data[field]) ? data[field][0] : data[field];
            el.classList.remove("hidden");
            shownFieldError = true;
          }
        });
        if (!shownFieldError) {
          showAlert(data.detail || "Email ya password galat hai.", "error");
        }
        return;
      }

      // SimpleJWT response: { access: "...", refresh: "..." }
      localStorage.setItem("access_token", data.access);
      localStorage.setItem("refresh_token", data.refresh);

      showAlert("Login successful! Redirecting...", "success");
      setTimeout(() => (window.location.href = "/dashboard/"), 800);

    } catch (err) {
      showAlert("Server se connect nahi ho paya. Baad me try karo.", "error");
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "Login";
    }
  });
</script>
</body>
</html>
